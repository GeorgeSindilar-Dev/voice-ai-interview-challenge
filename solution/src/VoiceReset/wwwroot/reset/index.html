<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set a new password</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <main>
    <h1 class="title"><span class="badge icon-key" aria-hidden="true"></span>Set a new password</h1>
    <div id="reset-message" class="message" role="status" aria-live="polite"></div>

    <form id="reset-form" class="reset-form" hidden>
      <h2 id="policy-title">Password rules</h2>
      <ul id="policy-rules" aria-labelledby="policy-title"></ul>

      <label for="new-password">New password</label>
      <input id="new-password" type="password"
             autocomplete="new-password" autocapitalize="off" spellcheck="false" required>

      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password"
             autocomplete="new-password" autocapitalize="off" spellcheck="false" required>

      <button id="submit-button" type="submit"><span class="icon icon-check" aria-hidden="true"></span>Change password</button>
    </form>

    <p id="login-link" hidden><a href="/mock/login" class="button-link"><span class="icon icon-log-in" aria-hidden="true"></span>Sign in with your new password</a></p>
    <p class="note warning">Never tell your password to the assistant on the call. Type it only on this page.</p>
  </main>
  <script type="module" src="/reset/reset.js"></script>
</body>
</html>
